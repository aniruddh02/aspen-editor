[package]
name = "aspen"
version = "0.1.3"
description = "Aspen — photo deduplication and studio tools"
authors = ["Aniruddh Tiwari <https://github.com/aniruddh02>"]
edition = "2021"

[lib]
name = "aspen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
walkdir = "2"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
rayon = "1"
thiserror = "2"
anyhow = "1"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
rustdct = "0.7"
num-traits = "0.2"
tempfile = "3"
rmcp = { version = "0.8", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
